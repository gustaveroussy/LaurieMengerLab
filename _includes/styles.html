<!-- site-wide css styles -->
{%- for file in site.pages -%}
  {%- if file.url contains "/css" -%}
    {%- unless file.url contains ".map" -%}
      {% assign path = file.path | replace: ".scss", ".css" %}
      <link href="{{ path | relative_url }}?v={{ site.time | date: '%s' }}" rel="stylesheet" />
    {%- endunless -%}
  {%- endif -%}
{%- endfor -%}
