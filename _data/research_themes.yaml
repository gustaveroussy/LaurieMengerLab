- id: in-vivo-car-t
  label: Fibrosis & autoimmunity
  title: In vivo CAR-T for autoimmune diseases
  short: Anti-fibrotic CAR-T cells generated directly in the patient with LNP-delivered mRNA.
  body:
    - "Fibrosis is a severe, life-limiting complication in diseases such as Duchenne Muscular Dystrophy (DMD) and Systemic Sclerosis (SSc), for which no specific treatments currently exist. We propose repurposing Chimeric Antigen Receptor (CAR) cell therapy to target fibrosis. Preclinical models demonstrate that FAP-specific CAR-T cells can mitigate pathological extracellular matrix deposition and improve organ function, offering a promising therapeutic avenue in non-tumor environments."
    - "To overcome the logistical complexity, high costs, and delays associated with conventional ex vivo CAR-T manufacturing, this project aims to develop an innovative in vivo reprogramming strategy. By using optimized lipid nanoparticle (LNP) technology to deliver CAR-encoding modified RNA directly to the host, we intend to generate transient, anti-fibrotic CAR-T cells directly within the patient, paving the way for a scalable, off-the-shelf solution for fibrotic diseases."
  funders:
    - name: VivoCARFIB (ANR AAPG 2025)
      logo: images/home/founding/anr_logo.jpg
  collab: Philippe Menasché (HEGP), Jérôme Avouac (Cochin)
